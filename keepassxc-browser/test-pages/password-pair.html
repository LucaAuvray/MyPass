<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two password fields, no form</title>
<style>body{font:15px/1.4 system-ui,sans-serif;max-width:640px;margin:2em auto;padding:0 1em}label{display:block;margin:.6em 0}input{padding:.3em;margin-left:.4em}button,[role=button]{padding:.4em .9em;margin:.3em .3em .3em 0;cursor:pointer;border:1px solid #888;border-radius:4px;background:#eee;display:inline-block}small{color:#555}[role=dialog]{border:2px solid #36c;padding:1em;margin:1em 0;background:#f4f8ff}</style>
</head>
<body>
<h1>Two password fields, no form</h1>
<p><small>No form element, no autocomplete hints, no account words in the path or the text: only the two-field rule applies. Expect: the menu on the first password field only; one click fills both; nothing on the second field.</small></p>
<div>
<label>Email <input type="email" name="email"></label>
<label>Password <input type="password" name="password"></label>
<label>Repeat password <input type="password" name="repeat"></label>
<div role="button" id="b" tabindex="0">Continue</div>
</div>
<script>
document.getElementById('b').onclick=function(){location.href='dashboard.html';};
</script>
</body>
</html>
