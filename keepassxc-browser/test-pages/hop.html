<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirect hop</title>
<style>body{font:15px/1.4 system-ui,sans-serif;max-width:640px;margin:2em auto;padding:0 1em}label{display:block;margin:.6em 0}input{padding:.3em;margin-left:.4em}button,[role=button]{padding:.4em .9em;margin:.3em .3em .3em 0;cursor:pointer;border:1px solid #888;border-radius:4px;background:#eee;display:inline-block}small{color:#555}[role=dialog]{border:2px solid #36c;padding:1em;margin:1em 0;background:#f4f8ff}</style>
</head>
<body>
<h1>Redirect hop</h1>
<p><small>Field-less hop: redirects to itself with n-1, then to dashboard.html when n reaches 0.</small></p>
<p id="m">Redirecting...</p>
<script>
var n=+new URLSearchParams(location.search).get('n')||0;setTimeout(function(){location.replace(n>0?'hop.html?n='+(n-1):'dashboard.html');},300);
</script>
</body>
</html>
