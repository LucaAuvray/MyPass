<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>body{font:15px/1.4 system-ui,sans-serif;max-width:640px;margin:2em auto;padding:0 1em}label{display:block;margin:.6em 0}input{padding:.3em;margin-left:.4em}button,[role=button]{padding:.4em .9em;margin:.3em .3em .3em 0;cursor:pointer;border:1px solid #888;border-radius:4px;background:#eee;display:inline-block}small{color:#555}[role=dialog]{border:2px solid #36c;padding:1em;margin:1em 0;background:#f4f8ff}</style>
</head>
<body>
<h1>Sign in</h1>
<p><small>Expect: no suggestion on Password. Submitting new credentials still offers the save banner on the next page; known credentials do not.</small></p>
<form id="f"><label>Username <input type="text" name="user" autocomplete="username"></label>
<label>Password <input type="password" name="password"></label>
<button type="submit">Sign in</button></form>
<p>Don't have an account? <a href="signup-form.html">Sign up</a></p>
<script>
document.getElementById('f').onsubmit=function(e){e.preventDefault();setTimeout(function(){location.href='dashboard.html';},100);};
</script>
</body>
</html>
