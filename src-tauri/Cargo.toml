[package]
name = "mypass"
version = "0.1.2"
description = "MyPass — Modern Password Manager"
authors = ["MyPass"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "mypass_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mypass-core = { path = "../crates/mypass-core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Ensures only one MyPass process runs, so the browser bridge and the unlocked
# vault always live in the same process (a second instance can't own the
# bridge port and would answer the extension with a locked/empty vault).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
crypto_box = "0.9"
base64 = "0.22"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "encryption", "getrandom"] }
ssh-agent-lib = "0.5"
signature = "2"
